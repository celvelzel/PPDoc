<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>智慧文档分析</title>

    <!-- 在线引入vue，具体看官网：https://v2.cn.vuejs.org/v2/guide/ -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <!-- 引入axios-->
    <script type="text/javascript" src="https://unpkg.com/axios@1.6.2/dist/axios.min.js"></script>

    <!-- 下面是在线引入element ui的样式和组件库，具体看官网：https://element.eleme.cn/#/zh-CN/component/installation  -->
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <!-- 引入组件库 -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <style>
        /* 自定义CSS类，用于居中对齐 */
        .centered-row {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg {
            background: #d5dae0;
        }

        body {
            background-color: #f5f5f5;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 960px; /* Adjust the max-width as needed */
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .el-row {
            margin-bottom: 20px;
        }

        .el-form {
            background-color: #fff;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }

        .el-form-item {
            margin-bottom: 15px;
        }

        .el-upload {
            margin-top: 10px;
        }

        .el-button {
            margin-right: 10px;
        }

        .center-text {
            text-align: center;
        }
    </style>

</head>

<body>
<div id="app" class="container">
    <el-row class="centered-row bg">
        <el-col class="centered-row">
            <el-upload action="http://localhost:8080/images"
                       list-type="picture-card"
                       :on-preview="handlePictureCardPreview"
                       :on-remove="handleRemove"
                       :on-success="handleSuccessImage">
                <i class="el-icon-plus"></i>
            </el-upload>
            <el-dialog :visible.sync="dialogVisible">
                <img width="100%" :src="dialogImageUrl" alt="">
            </el-dialog>
        </el-col>
        <el-col class="centered-row">
            <el-upload action="http://localhost:8080/pdfs"
                       :on-preview="handlePictureCardPreview"
                       :on-remove="handleRemove"
                       :on-success="handleSuccessPdf"
                       :before-remove="beforeRemove"
                       multiple
                       :limit="2"
                       :on-exceed="handleExceed"
                       :file-list="fileList">
                <el-button size="small" type="primary">点击上传</el-button>
                <div slot="tip" class="el-upload__tip">只能上传pdf文件</div>
            </el-upload>
        </el-col>
    </el-row>

    <el-row :gutter="30" style="margin-top: 10px;">
        <el-col :span="12">
            <!-- 表单-->
            <el-form ref="form" :model="userInfoForm" label-width="80px">
                <el-form-item label="姓名">
                    <el-input v-model="userInfoForm.name"></el-input>
                </el-form-item>
                <el-form-item label="民族">
                    <el-input v-model="userInfoForm.nation"></el-input>
                </el-form-item>
                <el-form-item label="性别">
                    <el-radio-group v-model="userInfoForm.sex">
                        <el-radio label="男"></el-radio>
                        <el-radio label="女"></el-radio>
                    </el-radio-group>
                </el-form-item>
                <el-form-item label="住址">
                    <el-input type="textarea" v-model="userInfoForm.address"></el-input>
                </el-form-item>
                <el-form-item label="身份证号">
                    <el-input v-model="userInfoForm.cardNumber"></el-input>
                </el-form-item>
                <el-form-item label="所有文本">
                    <el-input v-model="userInfoForm.allInfo"></el-input>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" @click="onSubmit">提交表单</el-button>
                    <el-button>取消</el-button>
                </el-form-item>
            </el-form>
        </el-col>

        <!-- 输出结果和按钮 -->
        <el-col :span="12">
            <el-input
                    type="textarea" readonly="true" :rows="10" placeholder="输出结果" v-model="outputResult"
            ></el-input>
            <el-form label-width="80px" style="margin-top: 10px;">
                <el-form-item label="待抽取字段" label-width="85px" rows="4">
                    <el-input type="textarea"
                              :autosize="{ minRows: 2, maxRows: 4}"
                              v-model="fields"
                              placeholder="多个字段需要用逗号分隔，如姓名，性别，年龄"
                    ></el-input>
                </el-form-item>
                <br><br>
                <el-form-item>
                    <el-button type="primary" @click="exportResult">导出结果</el-button>
                    <el-button @click="clearHistory">清空历史会话</el-button>
                </el-form-item>
            </el-form>
        </el-col>
    </el-row>
</div>

<script>
    var app = new Vue({
        el: '#app',
        data: {
            userInfoForm: {
                name: undefined,
                nation: undefined,
                address: undefined,
                cardNumber: '',
                sex: undefined,
                birthday: '',
                allInfo: ''
            },
            fields: "",
            outputResult: '',
            dialogImageUrl: '',
            dialogVisible: false,
            fileList: []
            //{name: 'test.pdf', url: ''}
        },
        methods: {
            // element UI中el-upload图片上传成功时的回调，详情看官网
            // https://element.eleme.cn/#/zh-CN/component/upload
            handleSuccessImage(response, file, fileList) {
                console.log(response)
                this.userInfoForm = response
            },
            /**
             * PDF文件上传成功后的回调函数
             * @param {Object} response 上传后的响应数据
             * @param {Object} file 上传的文件对象
             * @param {Array} fileList 文件列表
             */
            handleSuccessPdf(response, file, fileList) {
                // 假设服务器返回的响应数据中包含了文件的URL
                const newFile = {
                    name: file.name, // 文件名
                    url: response.url // 服务器返回的文件URL
                };
                // 将新文件添加到fileList数组中
                this.fileList.push(newFile);
                // 如果有文件数量限制，需要进行相应的处理
                if (this.fileList.length > this.limit) {
                    // 可以选择移除最早的文件
                    this.fileList.shift();
                }
                console.log(response)
                this.userInfoForm = response
            },
            handleRemove(file, fileList) {
                console.log(file, fileList);
                if (fileList.length == 0) {
                    this.userInfoForm = {
                        name: undefined,
                        nation: undefined,
                        address: undefined,
                        cardNumber: undefined,
                        sex: undefined,
                        birthday: undefined
                    }
                }
            },
            handlePictureCardPreview(file) {
                this.dialogImageUrl = file.url;
                this.dialogVisible = true;
            },
            handleExceed(files, fileList) {
                this.$message.warning(`当前限制选择 3 个文件，本次选择了 ${files.length} 个文件，共选择了 ${files.length + fileList.length} 个文件`);
            },
            beforeRemove(file, fileList) {
                return this.$confirm(`确定移除 ${file.name}？`);
            },

            // 发送axios请求，将表单数据保存的数据库中
            onSubmit() {
                // 这里可以发送axios请求，将表单数据保存到数据库中
            },
            exportResult() {
                // 这里可以添加导出结果的处理逻辑
                console.log('导出结果');
                // 获取待抽取字段的值
                var fieldsToExtract = this.fields;
                var ocr_text = this.userInfoForm.allInfo;
                const postData = {
                    fields: fieldsToExtract,
                    ocr_text: ocr_text
                };

                // 发送请求到后端 API
                axios.post('/extractinfo', postData)
                    .then(response => {
                        // 处理后端返回的响应

                        console.log('导出结果请求成功');
                        this.outputResult = JSON.stringify(response.data);
                        // 这里可以进行文件下载或其他操作
                    })
                    .catch(error => {
                        // 处理错误情况
                        console.error('导出结果请求失败', error);
                    });
            },
            clearHistory() {
                // 这里可以添加清空历史会话的处理逻辑
                this.outputResult = '';
                this.fields.field = '';
                console.log('清空历史会话');
            }
        }
    })
</script>
</body>

</html>
